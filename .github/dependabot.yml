# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # pycamt 1.1.x rewrote Camt053Parser (requires bytes, uses lxml,
      # dropped camt.054 support), breaking CAMT import. Pinned to 1.0.1 in
      # pyproject.toml. Remove once MyCamt053Parser is migrated to the new API.
      - dependency-name: "pycamt"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
