[project]
name = "myproject"
version = "1.0"
requires-python = ">=3.14"
dependencies = [
  "django==6.1.*",
  "gunicorn",
  "python-dotenv",
  "qrbill",
  "cairosvg",
  "pypdf>=6.16.1",
  "pandas",
  "xlsxwriter",
  "django-debug-toolbar>=7.1.1",
  # pycamt 1.1.x rewrote Camt053Parser (requires bytes, uses lxml). Our
  # CamtParser subclass adapts to it: see core/camt_importer/camt_importer.py.
  "pycamt==1.1.1",
  "django-phonenumber-field[phonenumberslite]",
  "django-unfold>=0.104.1",
]
[tool.setuptools.packages.find]
exclude = ["tests*", "migrations*", "public*"]

[project.optional-dependencies]
dev = [
  "ruff",
  "rust-just",
  "pytest",
  "beautifulsoup4",
]

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
exclude = '''
(
    \..*/
    |/node_modules
    |/virtualization
    |migrations/
)
'''
[tool.ruff]
# Generated migrations are excluded from linting, matching black/flake8 above.
extend-exclude = ["*/migrations/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
